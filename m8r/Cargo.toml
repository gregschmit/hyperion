[workspace]

[package]
name = "m8r"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "m8r-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.3", default-features = false }

[dependencies]
loco-rs = { workspace = true, features = ["auth", "auth_session", "cli", "with-db", "db-sqlite", "generators"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "signal",
  "time",
  "io-util",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
axum-extra = { version = "0.10", features = ["form"] }
# Prompts are templates (the same engine as the views).
tera = { version = "2.1" }
# Schedules are five-field cron expressions.
croner = { version = "4" }

[[bin]]
name = "m8r-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
# `testing-core` leaves out the HTML selector assertions (`assert_css_*`);
# switch to `testing` to get them, at the cost of a slower first `cargo test`.
loco-rs = { workspace = true, features = ["testing-core"] }
serial_test = { version = "3.1.1" }
# The request tests name its response type.
axum-test = { version = "17" }

# Dependencies build without debug info. Your own crates keep it, so
# breakpoints and backtraces in app code work as before; this roughly halves
# the size of target/.
[profile.dev.package."*"]
debug = false
