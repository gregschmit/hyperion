# Tests: `cargo test`. The database is rebuilt for each test.

logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  host: http://localhost
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: ForegroundBlocking

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://m8r_test.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="1") %>
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

auth:
  jwt:
    secret: bThyLXRlc3Qtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi11c2UtMDAwMDAwMDAwMDAw
    expiration: 28800
  session:
    secret: bThyLXRlc3Qtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi11c2UtMDAwMDAwMDAwMDAw
    max_age: 28800

settings:
  url: http://localhost:5150
  # Not a login shell's profile: tests must not depend on the developer's dotfiles.
  shell: /bin/sh
  agent: cat
  run_limit: 1
  data: target/test-data
