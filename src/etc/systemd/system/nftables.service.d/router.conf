# Route between the LAN and the uplinks only while the firewall is loaded. If nftables.conf fails to
# load (at boot, or on a restart, which apt also does on upgrades), the router stops routing
# instead of passing everything.
#
# Stopping the service keeps the rules: loading nftables.conf replaces them in one step anyway, so
# a restart with a broken file leaves the old ones in place. To clear them, stop the service first,
# so the router stops routing: `systemctl stop nftables && nft flush ruleset`.
[Service]
ExecStop=
ExecStartPost=/usr/sbin/sysctl -q -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1
ExecStopPost=/usr/sbin/sysctl -q -w net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
# Only "all" decides whether IPv6 is forwarded. Keep lan's own flag on, so LAN hosts still see a
# router, and keep their IPv6 default route for when routing comes back.
ExecStopPost=-/usr/sbin/sysctl -q -w net.ipv6.conf.lan.forwarding=1
