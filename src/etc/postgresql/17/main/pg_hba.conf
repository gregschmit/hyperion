# Who may connect, and how: Debian's defaults for local connections, plus password logins over TLS
# from the network. /etc/nftables.conf decides which addresses can reach postgres at all. ./install
# sets the postgres password (see /root/postgres_pw.txt).
#
# TYPE   DATABASE     USER      ADDRESS                    METHOD
local    all          postgres                             peer
local    all          all                                  peer
host     all          all       127.0.0.1/32               scram-sha-256
host     all          all       ::1/128                    scram-sha-256
local    replication  all                                  peer
host     replication  all       127.0.0.1/32               scram-sha-256
host     replication  all       ::1/128                    scram-sha-256

hostssl  all          all       0.0.0.0/0                  scram-sha-256
hostssl  all          all       ::/0                       scram-sha-256
