#!/usr/sbin/nft -f

# Firewall and NAT for the router, the LAN, and the guest networks. Check changes with
# `nft -c -f /etc/nftables.conf`, then apply them with `systemctl reload-or-restart nftables` (a
# plain reload fails while the service is down). If the file fails to load, the old rules stay;
# see also /etc/systemd/system/nftables.service.d/router.conf.

# Replace only our own tables, so a reload keeps tables that other software adds (e.g. Docker or
# fail2ban).
destroy table inet hyperion
destroy table ip hyperion
destroy table ip6 hyperion

# Interface names come from the .link files in /etc/systemd/network. When one uplink carries both
# IPv4 and IPv6, nothing here needs to change.
define WAN = { "wan4", "wan6" }
define WAN4 = "wan4"
define LAN = "lan"
define GUEST4 = "guest4"
define GUEST6 = "guest6"
define GUESTS = { $GUEST4, $GUEST6 }
define RXG = "rxg"

table inet hyperion {
	# Trusted clients on the internet (for now, my own address blocks): only they may reach Postgres
	# and Redis. Those take any address themselves, so this is the one list to keep. The rules
	# below take them only from the WAN: the IPv6 block also holds guest6's prefix.
	set trusted_clients_v4 {
		type ipv4_addr; flags interval
		elements = { 209.173.223.176/29 }
	}
	set trusted_clients_v6 {
		type ipv6_addr; flags interval
		elements = { 2603:300a:2161:ca00::/55 }
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state vmap { established : accept, related : accept, invalid : drop }
		iif lo accept

		# Ping, and IPv6 neighbor and router discovery. ICMP errors, such as those for path MTU
		# discovery, match "related" above.
		icmp type echo-request accept
		meta l4proto ipv6-icmp accept

		# DHCPv6 replies from the ISP. They come from a different address than the multicast
		# solicit went to, so conntrack can't match them. DHCPv4 needs no rule: conntrack matches
		# replies to renewals, and networkd reads the other replies on a raw socket, which sees
		# packets before the firewall.
		iifname $WAN udp sport 547 udp dport 546 accept

		# The LAN may use anything on the router (DNS, DHCP, SSH, Postgres, Redis, the UniFi
		# controller, ...).
		iifname $LAN accept

		# Guests may use DHCP (on guest4) and router discovery (above) on the router, and what the
		# internet may use (below), but nothing else. They use Cloudflare's DNS servers, not the
		# router's (see dnsmasq.d/guest.conf).
		iifname $GUEST4 udp dport 67 accept

		# Open to the internet: SSH, HTTP, and HTTPS. UniFi OS Server's ports stay closed: its
		# rootless podman listens on the router like any other service, so this chain decides.
		tcp dport { 22, 80, 443 } accept
		# Postgres and Redis, for trusted clients only (see above).
		iifname $WAN ip saddr @trusted_clients_v4 tcp dport { 5432, 6379 } accept
		iifname $WAN ip6 saddr @trusted_clients_v6 tcp dport { 5432, 6379 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state vmap { established : accept, related : accept, invalid : drop }

		# The LAN may open any connection to the internet. Replies return via the rule above,
		# and nothing else gets in.
		iifname $LAN oifname $WAN accept

		# The LAN and the old rXg's network (VLAN 10; see 20-rxg.network) may open connections to
		# each other, with no NAT.
		iifname $LAN oifname $RXG accept
		iifname $RXG oifname $LAN accept

		# Guests may open connections to the internet, but reach nothing local: not the LAN, and
		# not the other guest network. (The ip and ip6 tables below drop what they send from
		# addresses that aren't theirs.)
		iifname $GUESTS oifname $WAN accept

		# Port forwards to the LAN (see the dnat rules in table ip hyperion). Other software's dnat
		# (e.g. rootful containers) stays closed to the internet.
		iifname $WAN oifname $LAN ct status dnat accept

		# Open a LAN server to the internet over IPv6, by its fixed address (see 20-lan.network):
		# iifname $WAN oifname $LAN ip6 daddr 2603:300a:2161:ca00::2 tcp dport { 80, 443 } accept
	}
}

table ip hyperion {
	# Drop what guests send from addresses that wouldn't be routed back to them, e.g. a LAN host's:
	# the replies would go there. This reverse-path check needs no addresses. It's in the ip and
	# ip6 tables, since some kernels (e.g. Docker Desktop's, for test/run) can't do it in inet ones.
	chain forward {
		type filter hook forward priority filter;
		iifname $GUESTS fib saddr . iif oif missing drop
	}

	chain prerouting {
		type nat hook prerouting priority dstnat;

		# Port forward, e.g. TCP 2222 on the WAN address to SSH on a lab host:
		# iifname $WAN4 tcp dport 2222 dnat to 172.31.0.10:22
	}

	chain postrouting {
		type nat hook postrouting priority srcnat;

		# Share the IPv4 WAN address with the LAN. IPv6 is routed as-is, with no NAT.
		oifname $WAN4 masquerade
	}
}

table ip6 hyperion {
	# See table ip hyperion.
	chain forward {
		type filter hook forward priority filter;
		iifname $GUESTS fib saddr . iif oif missing drop
	}
}
