# DHCP, DNS, and router advertisements for the LAN; see dnsmasq(8). Check changes with
# `dnsmasq --test --conf-dir=/etc/dnsmasq.d`, then restart dnsmasq (reload doesn't re-read this
# file).

# Serve the LAN (dnsmasq adds loopback itself, and guest.conf adds the guest networks).
# bind-dynamic follows address changes, like a new delegated IPv6 prefix.
interface=lan
bind-dynamic

# Forward DNS to Cloudflare, not to the servers in /etc/resolv.conf (which points here).
no-resolv
server=1.1.1.1
server=1.0.0.1
server=2606:4700:4700::1111
server=2606:4700:4700::1001
# Don't forward plain names or reverse lookups of private addresses.
domain-needed
bogus-priv
cache-size=1000

# DHCP clients get a name under home.arpa (RFC 8375), e.g. laptop.home.arpa.
domain=home.arpa
local=/home.arpa/
# Skip /etc/hosts, which maps the hostname to 127.0.1.1 on Debian; name the router here instead,
# and static lab hosts too, e.g. host-record=lab1,lab1.home.arpa,172.31.0.10.
no-hosts
interface-name=hyperion.home.arpa,lan

# The UniFi controller (UniFi OS Server on this router): UniFi devices look for "unifi" to adopt.
interface-name=unifi,lan/4
interface-name=unifi.home.arpa,lan/4

# Hand out .100-.254, and keep .2-.99 for static lab hosts and the fixed hosts below.
dhcp-range=172.31.0.100,172.31.0.254,12h
# This is the only DHCP server on the LAN, so correct clients that hold leases from elsewhere.
dhcp-authoritative

# Router advertisements for the IPv6 prefix on lan, with the router as DNS server. ra-only: clients
# use SLAAC (or a static address), and there is no DHCPv6. If the prefix changes, the old one is
# advertised as deprecated, so clients stop using it; 1h caps how long they keep a prefix the
# router can't withdraw (e.g. across a reboot).
dhcp-range=::,constructor:lan,ra-only,1h

# Fixed hosts: a set address (outside the pool) and any boot options, used to provision the host.
# Force the options: the client may not request them, and dnsmasq would then squeeze 66 and 67
# into the short BOOTP header fields instead of sending them as options. (dnsmasq ends both with a
# NUL byte, which RFC 2132 clients drop.)

# rXg runner 144: after a factory reset, it pulls its config template from rxg-tools.
dhcp-host=bc:24:11:f3:b9:07,set:rxgrunner144,172.31.0.23
dhcp-option-force=tag:rxgrunner144,66,"https://raw.githubusercontent.com/gregschmit/rxg-tools/master/config_templates"
dhcp-option-force=tag:rxgrunner144,67,"rxgrunner144.yml.erb"
