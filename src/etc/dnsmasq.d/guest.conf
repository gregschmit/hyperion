# DHCP and router advertisements for the guest networks (see 20-guest4.network and
# 20-guest6.network). The settings in lan.conf apply here too, unless they name lan. dnsmasq tags
# each request with the interface it came in on, e.g. tag:guest4.

interface=guest4
interface=guest6

# Hand out .100-.254, like on lan.
dhcp-range=172.31.20.100,172.31.20.254,12h
dhcp-range=172.31.21.100,172.31.21.254,12h
# Router advertisements for guest6's IPv6 prefix, like on lan (see lan.conf).
dhcp-range=::,constructor:guest6,ra-only,1h

# Cloudflare's DNS servers instead of the router's (the IPv6 ones in guest6's router
# advertisements). nftables.conf keeps guests off the router's DNS, so they can't look up LAN
# hosts.
dhcp-option=tag:guest4,option:dns-server,1.1.1.1,1.0.0.1
dhcp-option=tag:guest6,option:dns-server,1.1.1.1,1.0.0.1
dhcp-option=tag:guest6,option6:dns-server,[2606:4700:4700::1111],[2606:4700:4700::1001]
# Keep guests' names out of DNS, so a guest can't take a LAN host's name.
dhcp-ignore-names=tag:guest4
dhcp-ignore-names=tag:guest6

# Limit each guest device's bandwidth, by its lease. dnsmasq runs this on every lease change, on
# lan too, and guest-shaper ignores those.
dhcp-script=/usr/local/sbin/guest-shaper
