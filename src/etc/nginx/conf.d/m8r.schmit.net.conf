# m8r (see /srv/hyperion/m8r/README.md) at m8r.schmit.net, open to the internet: every request
# needs a session, and the only way to get one is an access link (`m8r task link`). m8r-web
# listens on 127.0.0.1:5150.

# An access link carries its token in the query. Keep those requests out of the access log.
map $arg_token $m8r_log {
    ''      1;
    default 0;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m8r.schmit.net;

    # A Let's Encrypt certificate for the names above (see nginx.conf).
    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;

    access_log /var/log/nginx/access.log main if=$m8r_log;

    location / {
        proxy_pass http://127.0.0.1:5150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Plain HTTP only redirects. It stays open to all, since Let's Encrypt checks the name over it.
server {
    listen 80;
    listen [::]:80;
    server_name m8r.schmit.net;

    # A link typed with http:// carries its token here too.
    access_log /var/log/nginx/access.log main if=$m8r_log;

    return 301 https://$host$request_uri;
}
