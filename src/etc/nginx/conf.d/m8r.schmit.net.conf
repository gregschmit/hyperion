# m8r (see /srv/hyperion/m8r/README.md) at m8r.schmit.net, open to the internet. Its pages and
# its API need a session, which only an access link starts (`m8r task link`), or a token
# (`m8r task token`). Its MCP endpoint needs a token. m8r-web listens on 127.0.0.1:5150.
#
# A run's page gets what the run prints over a connection that stays open (server-sent
# events). m8r answers those with `X-Accel-Buffering: no`, so nginx hands each event on as it
# comes, and it sends a line every 15 seconds, so the connection outlasts `proxy_read_timeout`.

# An access link carries its token in the query. Keep those requests out of the access log.
map $arg_token $m8r_log {
    ''      1;
    default 0;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m8r.schmit.net;

    # A Let's Encrypt certificate for the names above (see nginx.conf).
    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;

    access_log /var/log/nginx/access.log main if=$m8r_log;

    location / {
        proxy_pass http://127.0.0.1:5150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Plain HTTP only redirects. It stays open to all, since Let's Encrypt checks the name over it.
server {
    listen 80;
    listen [::]:80;
    server_name m8r.schmit.net;

    # A link typed with http:// carries its token here too.
    access_log /var/log/nginx/access.log main if=$m8r_log;

    return 301 https://$host$request_uri;
}
