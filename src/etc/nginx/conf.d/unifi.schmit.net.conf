# UniFi OS Server's web UI, which listens on https://127.0.0.1:11443, at unifi.schmit.net.

# Pass WebSocket upgrades through; the UI uses them for live updates.
map $http_upgrade $unifi_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name unifi.schmit.net;

    # A Let's Encrypt certificate for the names above (see nginx.conf).
    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;

    # Only the LAN may manage the network. dnsmasq sends LAN clients here over IPv4 (see lan.conf).
    # Remove these two lines to open it to the internet.
    allow 172.31.0.0/24;
    deny all;

    location / {
        # The upstream certificate is self-signed; nginx doesn't verify it by default.
        proxy_pass https://127.0.0.1:11443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $unifi_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep idle WebSockets open.
        proxy_read_timeout 1h;
    }
}

# Plain HTTP only redirects. It stays open to all, since Let's Encrypt checks the name over it.
server {
    listen 80;
    listen [::]:80;
    server_name unifi.schmit.net;

    return 301 https://$host$request_uri;
}
