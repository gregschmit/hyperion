# gregschmit.com, a static site. Its DNS is on Cloudflare, where gregschmit.com and
# www.gregschmit.com are CNAMEs to hyperion.schmit.net. It works with Cloudflare's proxy on or off.
# With it on, Let's Encrypt checks each name through Cloudflare over plain HTTP, so keep "Always
# Use HTTPS" and any www redirect rule off there: nginx does both redirects below.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gregschmit.com;
    root /srv/hyperion/webroot/gregschmit.com;

    # Show the public keys in the browser instead of downloading them.
    location ~ \.pub$ {
        types { }
        default_type text/plain;
    }

    # A Let's Encrypt certificate for the names above (see nginx.conf).
    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
}

# A server of its own, so its own certificate: if www can't get one, gregschmit.com still does.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gregschmit.com;

    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;

    return 301 https://gregschmit.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name gregschmit.com www.gregschmit.com;

    return 301 https://gregschmit.com$request_uri;
}
