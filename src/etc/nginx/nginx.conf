# nginx.org's default main config, plus the ACME module: nginx gets and renews the sites' Let's
# Encrypt certificates by itself (see acme_certificate in conf.d), answering the challenges on
# port 80.
load_module modules/ngx_http_acme_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # The ACME module looks up the ACME server with this (dnsmasq on the router).
    resolver 127.0.0.1;

    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        # The account key and the certificates, kept across restarts.
        state_path /var/cache/nginx/acme-letsencrypt;
        accept_terms_of_service;
    }

    # The sites load their certificates from variables; don't parse them on each connection.
    ssl_certificate_cache max=16;

    include /etc/nginx/conf.d/*.conf;
}
