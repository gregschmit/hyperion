# Redis for the LAN, and for the internet from the addresses that /etc/nftables.conf allows.
# Network clients need the password (see /root/redis_pw.txt) and TLS: the certificate is Debian's
# self-signed "snakeoil" one, so connect with rediss:// and no verification (redis-cli --tls
# --insecure). Local clients can use the socket instead, as members of the redis group.

# The password, which ./install keeps here (and in /root/redis_pw.txt).
include /etc/redis/password.conf

bind * -::*
protected-mode yes
port 0
tls-port 6379
tls-cert-file /etc/ssl/certs/ssl-cert-snakeoil.pem
tls-key-file /etc/ssl/private/ssl-cert-snakeoil.key
tls-auth-clients no
unixsocket /run/redis/redis-server.sock
unixsocketperm 770

# Debian's paths (see redis-server.service).
pidfile /run/redis/redis-server.pid
logfile /var/log/redis/redis-server.log
dir /var/lib/redis
