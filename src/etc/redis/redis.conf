# Redis for the LAN, and for the internet from the addresses that /etc/nftables.conf allows. There
# is no password: the firewall decides who connects. Network clients need TLS: the certificate is
# Debian's self-signed "snakeoil" one, so connect with rediss:// and no verification (redis-cli
# --tls --insecure). Local clients can use the socket instead, as members of the redis group.

bind * -::*
# Protected mode would take only local clients, since there is no password.
protected-mode no
port 0
tls-port 6379
# redis reads the key as a member of ssl-cert (see redis-server.service.d/ssl-cert.conf).
tls-cert-file /etc/ssl/certs/ssl-cert-snakeoil.pem
tls-key-file /etc/ssl/private/ssl-cert-snakeoil.key
tls-auth-clients no
unixsocket /run/redis/redis-server.sock
unixsocketperm 770

# Debian's paths (see redis-server.service).
pidfile /run/redis/redis-server.pid
logfile /var/log/redis/redis-server.log
dir /var/lib/redis
